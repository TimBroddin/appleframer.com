    <meta name="description" content="Frame your Apple device screenshots with a beautiful device bezel. All processing happens locally - your images never leave your device. AppleFramer helps you showcase your screenshots beautifully.">
    <meta property="og:title" content="AppleFramer" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

      rel="stylesheet"
    />
    <script>
      // Apply the stored theme before first paint so a dark-mode reload
      // doesn't flash the light palette.
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var dark = stored
            ? stored === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {
          /* localStorage unavailable — fall back to light */
        }
      })();
    </script>
    <script
      src="https://stats.titans.sh/api/script.js"
      data-site-id="12"
      defer
    ></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script src="https://www.titansofindustry.be/project-menu.js"></script>
    <titans-project-menu theme="light" position="bottom-right"></titans-project-menu>
  </body>
